<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Página no encontrada | Grupo HCMC</title>
    <meta name="description" content="La página que buscas no existe o fue movida. Vuelve al inicio o contáctanos.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#071429">

    <!-- Google Tag Manager -->
    <script>(function (w, d, s, l, i) {
            w[l] = w[l] || []; w[l].push({
                'gtm.start':
                    new Date().getTime(), event: 'gtm.js'
            }); var f = d.getElementsByTagName(s)[0],
                j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
                    'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-PF57V79H');</script>
    <!-- End Google Tag Manager -->

    <!-- Favicon -->
    <link rel="icon" href="fav.ico" sizes="any">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <style>
        /* Estilos específicos de la página 404 */
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: radial-gradient(120% 120% at 15% 0%, var(--navy-soft) 0%, var(--navy) 45%, var(--navy-deep) 100%);
            color: var(--white);
            position: relative;
            overflow: hidden;
        }

        .error-header {
            padding: 24px 0;
            position: relative;
            z-index: 2;
        }

        .error-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px 80px;
            position: relative;
            z-index: 2;
        }

        .error-content {
            max-width: 640px;
            text-align: center;
        }

        .error-code {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(6rem, 20vw, 12rem);
            line-height: 0.9;
            letter-spacing: -0.04em;
            margin: 0;
            background: linear-gradient(135deg, var(--teal) 0%, var(--amber) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .error-title {
            color: var(--white);
            font-size: clamp(1.4rem, 3vw, 2rem);
            margin: 16px 0 12px;
        }

        .error-text {
            color: rgba(255, 255, 255, .72);
            font-size: 1.05rem;
            max-width: 520px;
            margin: 0 auto 32px;
        }

        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: .4;
            z-index: 1;
        }

        .error-footer {
            padding: 24px 0;
            text-align: center;
            color: rgba(255, 255, 255, .55);
            font-size: .85rem;
            position: relative;
            z-index: 2;
        }

        .error-footer a {
            color: rgba(255, 255, 255, .75);
        }

        .error-footer a:hover {
            color: var(--teal);
        }

        /* Logo en 404 */
        .error-header .logo {
            height: auto;
        }

        .error-header .logo-img {
            width: 44px;
            height: 44px;
        }

        .error-header .logo-text {
            font-size: 1.2rem;
        }
    </style>
</head>

<body>

    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PF57V79H" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="error-page">
        <canvas class="error-canvas" aria-hidden="true"></canvas>

        <header class="error-header">
            <div class="container">
                <a href="index.html" class="logo">
                    <img src="assets/img/logo.png" alt="Grupo HCMC" class="logo-img">
                    <span class="logo-text">Grupo HCMC</span>
                </a>
            </div>
        </header>

        <main class="error-main">
            <div class="container error-content">
                <h1 class="error-code">404</h1>
                <h2 class="error-title">Página no encontrada</h2>
                <p class="error-text">
                    La página que buscas no existe, fue movida o el enlace está roto.
                    No te preocupes: podemos ayudarte a encontrar lo que necesitas.
                </p>
                <div class="error-actions">
                    <a href="index.html" class="btn btn-primary">Volver al inicio</a>
                    <a href="index.html#contacto" class="btn btn-outline">Contactarnos</a>
                </div>
            </div>
        </main>

        <footer class="error-footer">
            <div class="container">
                <p>© <span data-year aria-hidden="true"></span> Grupo HCMC. Todos los derechos reservados.</p>
            </div>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            /* Año dinámico */
            document.querySelectorAll('[data-year]').forEach(el => {
                el.textContent = new Date().getFullYear();
            });

            /* Animación de red en el fondo (misma que el hero) */
            const canvas = document.querySelector('.error-canvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                let w, h, nodes, rafId;
                const NODE_COUNT = window.innerWidth < 720 ? 20 : 42;

                function resize() {
                    w = canvas.width = canvas.offsetWidth * devicePixelRatio;
                    h = canvas.height = canvas.offsetHeight * devicePixelRatio;
                }
                function initNodes() {
                    nodes = Array.from({ length: NODE_COUNT }, () => ({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        vx: (Math.random() - 0.5) * 0.25 * devicePixelRatio,
                        vy: (Math.random() - 0.5) * 0.25 * devicePixelRatio,
                    }));
                }

                function drawStatic() {
                    ctx.clearRect(0, 0, w, h);
                    const maxDist = 160 * devicePixelRatio;
                    for (let i = 0; i < nodes.length; i++) {
                        for (let j = i + 1; j < nodes.length; j++) {
                            const a = nodes[i], b = nodes[j];
                            const dx = a.x - b.x, dy = a.y - b.y;
                            const d = Math.sqrt(dx * dx + dy * dy);
                            if (d < maxDist) {
                                ctx.strokeStyle = `rgba(0,184,169,${(1 - d / maxDist) * 0.3})`;
                                ctx.lineWidth = 1;
                                ctx.beginPath();
                                ctx.moveTo(a.x, a.y);
                                ctx.lineTo(b.x, b.y);
                                ctx.stroke();
                            }
                        }
                    }
                    for (const n of nodes) {
                        ctx.fillStyle = 'rgba(0,184,169,0.85)';
                        ctx.beginPath();
                        ctx.arc(n.x, n.y, 1.6 * devicePixelRatio, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                function draw() {
                    ctx.clearRect(0, 0, w, h);
                    const maxDist = 160 * devicePixelRatio;
                    for (const n of nodes) {
                        n.x += n.vx; n.y += n.vy;
                        if (n.x < 0 || n.x > w) n.vx *= -1;
                        if (n.y < 0 || n.y > h) n.vy *= -1;
                    }
                    for (let i = 0; i < nodes.length; i++) {
                        for (let j = i + 1; j < nodes.length; j++) {
                            const a = nodes[i], b = nodes[j];
                            const dx = a.x - b.x, dy = a.y - b.y;
                            const d = Math.sqrt(dx * dx + dy * dy);
                            if (d < maxDist) {
                                ctx.strokeStyle = `rgba(0,184,169,${(1 - d / maxDist) * 0.3})`;
                                ctx.lineWidth = 1;
                                ctx.beginPath();
                                ctx.moveTo(a.x, a.y);
                                ctx.lineTo(b.x, b.y);
                                ctx.stroke();
                            }
                        }
                    }
                    for (const n of nodes) {
                        ctx.fillStyle = 'rgba(0,184,169,0.85)';
                        ctx.beginPath();
                        ctx.arc(n.x, n.y, 1.6 * devicePixelRatio, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    rafId = requestAnimationFrame(draw);
                }

                resize(); initNodes();

                if (prefersReduced) {
                    drawStatic();
                } else {
                    draw();
                    window.addEventListener('resize', () => { resize(); initNodes(); drawStatic(); });
                }
            }

        });
    </script>
</body>

</html>
